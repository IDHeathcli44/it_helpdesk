            - "waiting"
            - "done"
            - "closed"
        "author":
          "type": "object"
          "additionalProperties": false
          "required":
            - "id"
            - "fullName"
          "properties":
            "id":
              "type": "integer"
              "minimum": 1
              "maximum": 9007199254740991
            "fullName":
              "type": "string"
              "nullable": true
          "nullable": true
        "assignedTo":
          "type": "object"
          "additionalProperties": false
          "required":
            - "id"
            - "fullName"
          "properties":
            "id":
