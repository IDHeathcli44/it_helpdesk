  "/reports/summary":
    "get":
      "operationId": "getReportSummary"
      "summary": "IT/admin/director aggregate report from the existing service."
      "parameters":
        -
          "name": "period"
          "in": "query"
          "required": false
          "description": "Invalid or absent values default to 30. daily is always the last 14 calendar dates."
          "schema":
            "type": "string"
            "enum":
              - "7"
              - "30"
              - "90"
              - "365"
              - "all"
            "default": "30"
      "responses":
