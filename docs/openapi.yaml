"openapi": "3.0.3"
"info":
  "title": "IT HelpDesk read-only API"
  "version": "1.0.0"
  "description": "Phase 4.3A. Existing session authentication only. No mutation endpoints. All known resource endpoints except session require completed password change. Unknown paths/unsupported methods return JSON 404 for authenticated users, 401 for anonymous users. See API_V1.md for examples and limitations."
"servers":
  -
    "url": "/api/v1"
"security":
  -
    "sessionCookie": []
"paths":
  "/session":
    "get":
      "operationId": "getSession"
      "summary": "Current session, including required password change state."
      "parameters": []
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "required":
                  - "data"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Session"
        "400":
          "description": "INVALID_ID or INVALID_JSON"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "UNAUTHENTICATED: existing Express session required"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "FORBIDDEN or PASSWORD_CHANGE_REQUIRED"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "NOT_FOUND: missing resource or endpoint"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "PAYLOAD_TOO_LARGE: upstream body parser limit"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "INTERNAL_ERROR: exception details withheld"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/tickets":
    "get":
      "operationId": "listTickets"
      "summary": "Own tickets for user/accounting/procurement; all tickets for it/admin/director. Filters apply before the 100-row cap."
      "parameters":
        -
          "name": "search"
          "in": "query"
          "required": false
          "description": "Title/description LIKE substring. SQL wildcards supported; bound parameters."
          "schema":
            "type": "string"
        -
          "name": "status"
          "in": "query"
          "required": false
          "description": "Unknown values ignored."
          "schema":
            "type": "string"
            "enum":
              - "new"
              - "in_progress"
              - "waiting"
              - "done"
              - "closed"
        -
          "name": "priority"
          "in": "query"
          "required": false
          "description": "Unknown values ignored."
          "schema":
            "type": "string"
            "enum":
              - "low"
              - "normal"
              - "high"
              - "critical"
        -
          "name": "assigned"
          "in": "query"
          "required": false
          "description": "me, unassigned, or positive safe integer user ID. Invalid values ignored."
          "schema":
            "type": "string"
            "pattern": "^(me|unassigned|[1-9][0-9]*)$"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "required":
                  - "data"
                  - "meta"
                "properties":
                  "data":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/Ticket"
                  "meta":
                    "type": "object"
                    "additionalProperties": false
                    "required":
                      - "count"
                      - "limit"
                    "properties":
                      "count":
                        "type": "integer"
                      "limit":
                        "type": "integer"
                        "enum":
                          - 100
        "400":
          "description": "INVALID_ID or INVALID_JSON"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "UNAUTHENTICATED: existing Express session required"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "FORBIDDEN or PASSWORD_CHANGE_REQUIRED"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "NOT_FOUND: missing resource or endpoint"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "PAYLOAD_TOO_LARGE: upstream body parser limit"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "INTERNAL_ERROR: exception details withheld"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
