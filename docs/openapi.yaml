"components":
  "securitySchemes":
    "sessionCookie":
      "type": "apiKey"
      "in": "cookie"
      "name": "connect.sid"
      "description": "Obtain through existing /login form."
  "schemas":
    "Error":
      "type": "object"
      "additionalProperties": false
      "required":
        - "error"
      "properties":
        "error":
          "type": "object"
          "additionalProperties": false
          "required":
            - "code"
            - "message"
          "properties":
            "code":
              "type": "string"
            "message":
              "type": "string"
    "Session":
      "type": "object"
      "additionalProperties": false
      "required":
        - "user"
      "properties":
        "user":
          "type": "object"
          "additionalProperties": false
          "required":
            - "id"
            - "username"
            - "fullName"
            - "role"
            - "mustChangePassword"
          "properties":
            "id":
              "type": "integer"
              "minimum": 1
              "maximum": 9007199254740991
            "username":
              "type": "string"
            "fullName":
              "type": "string"
            "role":
              "type": "string"
              "enum":
                - "user"
                - "it"
                - "admin"
                - "accounting"
                - "procurement"
                - "director"
            "mustChangePassword":
              "type": "boolean"
    "Ticket":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "title"
        - "description"
        - "category"
        - "priority"
        - "status"
        - "author"
        - "assignedTo"
        - "equipment"
        - "createdAt"
        - "updatedAt"
        - "firstResponseAt"
        - "startedAt"
        - "completedAt"
        - "closedAt"
      "properties":
        "id":
          "type": "integer"
          "minimum": 1
          "maximum": 9007199254740991
        "title":
          "type": "string"
        "description":
          "type": "string"
        "category":
          "type": "string"
        "priority":
          "type": "string"
          "enum":
            - "low"
            - "normal"
            - "high"
            - "critical"
        "status":
          "type": "string"
          "enum":
            - "new"
            - "in_progress"
            - "waiting"
            - "done"
            - "closed"
        "author":
          "type": "object"
          "additionalProperties": false
          "required":
            - "id"
            - "fullName"
          "properties":
            "id":
              "type": "integer"
              "minimum": 1
              "maximum": 9007199254740991
            "fullName":
              "type": "string"
              "nullable": true
          "nullable": true
        "assignedTo":
          "type": "object"
          "additionalProperties": false
          "required":
            - "id"
            - "fullName"
          "properties":
            "id":
              "type": "integer"
              "minimum": 1
              "maximum": 9007199254740991
            "fullName":
              "type": "string"
              "nullable": true
          "nullable": true
        "equipment":
          "type": "object"
          "additionalProperties": false
          "required":
            - "id"
            - "name"
            - "assetTag"
          "properties":
            "id":
              "type": "integer"
              "minimum": 1
              "maximum": 9007199254740991
            "name":
              "type": "string"
              "nullable": true
            "assetTag":
              "type": "string"
              "nullable": true
          "nullable": true
        "createdAt":
          "type": "string"
          "nullable": true
          "description": "Existing UTC service timestamp, usually YYYY-MM-DD HH:mm:ss; null when not recorded."
        "updatedAt":
          "type": "string"
          "nullable": true
          "description": "Existing UTC service timestamp, usually YYYY-MM-DD HH:mm:ss; null when not recorded."
        "firstResponseAt":
          "type": "string"
          "nullable": true
          "description": "Existing UTC service timestamp, usually YYYY-MM-DD HH:mm:ss; null when not recorded."
        "startedAt":
          "type": "string"
          "nullable": true
          "description": "Existing UTC service timestamp, usually YYYY-MM-DD HH:mm:ss; null when not recorded."
        "completedAt":
          "type": "string"
          "nullable": true
          "description": "Existing UTC service timestamp, usually YYYY-MM-DD HH:mm:ss; null when not recorded."
        "closedAt":
          "type": "string"
          "nullable": true
          "description": "Existing UTC service timestamp, usually YYYY-MM-DD HH:mm:ss; null when not recorded."
    "TicketDetail":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "title"
        - "description"
        - "category"
        - "priority"
        - "status"
        - "author"
        - "assignedTo"
        - "equipment"
        - "createdAt"
        - "updatedAt"
        - "firstResponseAt"
        - "startedAt"
        - "completedAt"
        - "closedAt"
        - "comments"
        - "history"
        - "attachments"
      "properties":
